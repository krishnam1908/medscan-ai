<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedScan AI — Prescription Decoder</title>
  <meta name="description" content="Snap a prescription, get a clear medication schedule, interaction warnings, and reminders." />

  <!-- Tailwind (CDN build, no install needed) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#eefdf5", 100: "#d6f9e7", 200: "#aff0d0",
              300: "#79e3b4", 400: "#3fcd92", 500: "#1bb377",
              600: "#0f9060", 700: "#0e724f", 800: "#105a41",
              900: "#0f4a37", 950: "#042a1f",
            },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          keyframes: {
            'fade-up': {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'pulse-ring': {
              '0%': { transform: 'scale(0.9)', opacity: '0.7' },
              '100%': { transform: 'scale(1.6)', opacity: '0' },
            },
          },
          animation: {
            'fade-up': 'fade-up 0.5s ease-out forwards',
            'pulse-ring': 'pulse-ring 1.4s ease-out infinite',
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel so we can write JSX directly in app.js -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { backdrop-filter: blur(12px); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <!-- App config: change this if your backend runs elsewhere -->
  <script>
    window.MEDSCAN_API_BASE = "http://localhost:5000";
  </script>

  <!-- App code (JSX, transpiled in-browser by Babel) -->
  <script type="text/babel" data-type="module" src="app.js"></script>
</body>
</html>
